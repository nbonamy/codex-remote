<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Codex Remote · Device simulator</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #050607;
        --panel: #0c0f11;
        --panel-hi: #14191c;
        --line: #293034;
        --white: #f4f1e9;
        --muted: #8d979c;
        --mint: #84f5c2;
        --cyan: #62d7ff;
        --coral: #ff6b57;
        --yellow: #ffd166;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        margin: 0;
        overflow: hidden;
        background: #020303;
        color: var(--white);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      body.capture-mode {
        place-items: start;
      }

      #device {
        position: relative;
        width: 368px;
        height: 448px;
        overflow: hidden;
        background:
          radial-gradient(circle at 80% 8%, rgba(98, 215, 255, 0.08), transparent 30%),
          var(--black);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 0 17px;
        border-bottom: 1px solid var(--line);
        background: rgba(5, 6, 7, 0.88);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 780;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .mark {
        display: grid;
        width: 25px;
        height: 25px;
        place-items: center;
        border: 1px solid #3d494f;
        border-radius: 8px;
        color: var(--mint);
        font: 800 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        box-shadow: inset 0 0 14px rgba(132, 245, 194, 0.08);
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 720;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .connection-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--coral);
        box-shadow: 0 0 0 3px rgba(255, 107, 87, 0.1);
      }

      .connection.online .connection-dot {
        background: var(--mint);
        box-shadow: 0 0 0 3px rgba(132, 245, 194, 0.1);
      }

      .screen {
        height: 338px;
        padding: 15px 15px 10px;
        overflow: hidden;
      }

      .eyebrow {
        margin: 0 0 10px 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .thread-list {
        display: grid;
        gap: 6px;
      }

      .thread-card {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 50px;
        padding: 6px 10px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--panel);
      }

      .thread-card:active {
        border-color: rgba(132, 245, 194, 0.66);
        background:
          linear-gradient(90deg, rgba(132, 245, 194, 0.11), transparent 70%),
          var(--panel-hi);
        box-shadow: 0 0 0 1px rgba(132, 245, 194, 0.08);
      }

      .thread-icon {
        color: var(--muted);
        font: 700 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .agent-card {
        grid-template-columns: 26px minmax(0, 1fr) 18px;
      }

      .agent-icon {
        position: relative;
        width: 20px;
        height: 20px;
      }

      .agent-icon::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 20px;
        height: 14px;
        border: 1.5px solid var(--mint);
        border-radius: 3px;
        box-sizing: border-box;
        content: "";
      }

      .agent-icon::after {
        position: absolute;
        bottom: 0;
        left: 4px;
        width: 12px;
        height: 6px;
        background:
          linear-gradient(var(--mint), var(--mint)) center top / 1.5px 5px no-repeat,
          linear-gradient(var(--mint), var(--mint)) center bottom / 12px 1.5px no-repeat;
        content: "";
      }

      .agent-title {
        margin-bottom: 0;
      }

      .agent-chevron {
        justify-self: end;
        color: var(--muted);
        font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .thread-copy {
        min-width: 0;
      }

      .thread-title,
      .thread-preview {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .thread-title {
        margin-bottom: 3px;
        font-size: 13px;
        font-weight: 720;
      }

      .thread-preview {
        color: var(--muted);
        font-size: 10px;
      }

      .thread-age {
        align-self: start;
        padding-top: 2px;
        color: #657077;
        font-size: 9px;
      }

      .conversation {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .conversation-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin: 0 1px 4px;
      }

      .back-button {
        display: grid;
        flex: none;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 1px solid #30383c;
        border-radius: 9px;
        background: var(--panel);
        color: var(--white);
        font: 760 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .conversation-title h1 {
        flex: 1;
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: 17px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity {
        flex: none;
        padding: 4px 7px;
        border: 1px solid #2d363a;
        border-radius: 999px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .activity.busy {
        border-color: rgba(255, 209, 102, 0.35);
        color: var(--yellow);
      }

      .reader-status {
        margin: 0 2px 8px;
        color: #657077;
        font-size: 9px;
        font-weight: 720;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .message-reader {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        padding: 0 1px 4px;
      }

      .message-page {
        flex: 1;
        min-height: 0;
        padding: 11px 12px;
        overflow: hidden;
        border: 1px solid #20272a;
        border-radius: 13px;
        background: var(--panel);
        color: #d9dcda;
      }

      .message-page.user {
        border-color: rgba(98, 215, 255, 0.22);
        background: rgba(98, 215, 255, 0.09);
        color: #e9f7fb;
      }

      .message-role {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 9px;
        color: var(--mint);
        font-size: 9px;
        font-weight: 760;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .message-copy {
        margin: 0;
        overflow-wrap: normal;
        white-space: pre;
        font: 11px/1.42 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .message-page.streaming .message-role::after {
        display: inline-block;
        width: 5px;
        height: 9px;
        background: var(--mint);
        content: "";
        animation: blink 0.9s steps(1) infinite;
      }

      .reader-waiting {
        display: grid;
        flex: 1;
        place-items: center;
        border: 1px solid #20272a;
        border-radius: 13px;
        background:
          radial-gradient(circle at center, rgba(132, 245, 194, 0.08), transparent 58%),
          var(--panel);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .empty {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 28px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 56px;
        border-top: 1px solid var(--line);
        background: #080a0b;
      }

      .controls.single {
        grid-template-columns: 1fr;
      }

      .control[hidden] {
        display: none;
      }

      .control {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        touch-action: none;
      }

      .control + .control {
        border-left: 1px solid var(--line);
      }

      .key {
        display: grid;
        width: auto;
        min-width: 38px;
        height: 26px;
        padding: 0 8px;
        place-items: center;
        border: 1px solid #3c464b;
        border-radius: 999px;
        color: var(--white);
        font-size: 11px;
      }

      .control.primary .key {
        border-color: rgba(132, 245, 194, 0.5);
        color: var(--mint);
      }

      .recording {
        position: absolute;
        inset: 54px 0 56px;
        display: none;
        place-items: center;
        background:
          radial-gradient(circle at center, rgba(255, 107, 87, 0.16), transparent 55%),
          rgba(5, 6, 7, 0.94);
        backdrop-filter: blur(8px);
      }

      .recording.visible {
        display: grid;
      }

      .recording-inner {
        display: grid;
        justify-items: center;
        gap: 17px;
      }

      .record-dot {
        width: 88px;
        height: 88px;
        border: 2px solid rgba(255, 107, 87, 0.5);
        border-radius: 999px;
        background: var(--coral);
        box-shadow:
          0 0 0 14px rgba(255, 107, 87, 0.08),
          0 0 55px rgba(255, 107, 87, 0.25);
        animation: breathe 1.25s ease-in-out infinite;
      }

      .record-label {
        font-size: 18px;
        font-weight: 780;
      }

      .record-hint {
        color: var(--muted);
        font-size: 11px;
      }

      .toast {
        position: absolute;
        right: 14px;
        bottom: 68px;
        left: 14px;
        display: none;
        padding: 10px 12px;
        border: 1px solid rgba(255, 107, 87, 0.38);
        border-radius: 10px;
        background: #23110f;
        color: #ffd9d3;
        font-size: 10px;
        line-height: 1.35;
      }

      .toast.visible {
        display: block;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      @keyframes breathe {
        50% { transform: scale(0.92); opacity: 0.84; }
      }
    </style>
  </head>
  <body>
    <main id="device">
      <header class="topbar">
        <div class="brand">
          <span class="mark">&gt;_</span>
          <span id="brand-label">Codex Remote</span>
        </div>
        <div class="connection" id="connection">
          <span class="connection-dot"></span>
          <span id="connection-label">Offline</span>
        </div>
      </header>
      <section class="screen" id="screen"></section>
      <footer class="controls">
        <button class="control primary" id="button-a" type="button">
          <span class="key">BOOT</span>
          <span id="button-a-label">Open</span>
        </button>
        <button class="control" id="button-b" type="button">
          <span class="key">PWR</span>
          <span id="button-b-label">Next</span>
        </button>
      </footer>
      <div class="recording" id="recording">
        <div class="recording-inner">
          <div class="record-dot"></div>
          <div class="record-label">Listening</div>
          <div class="record-hint">PWR to send · BOOT to cancel</div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </main>
    <script>
      const THREADS_PER_PAGE = 5;
      const MESSAGE_LINES_PER_PAGE = 16;
      const query = new URLSearchParams(location.search);
      const token = query.get("token") || "";
      const agentId = query.get("agentId") || "codex";
      document.body.classList.toggle("capture-mode", query.get("capture") === "1");
      const socketProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = `${socketProtocol}//${location.host}/api/v1/agents/${
        encodeURIComponent(agentId)
      }/device?token=${encodeURIComponent(token)}`;
      const state = {
        connected: false,
        view: "threads",
        agents: [],
        agentPage: 0,
        switchingAgent: false,
        agentName: "",
        threads: [],
        threadPage: 0,
        thread: null,
        readerMessageId: null,
        readerPage: 0,
        awaitingResponse: false,
        responseBaselineId: null,
        status: "ready",
        recording: false,
        transcription: "unavailable",
      };

      const screen = document.getElementById("screen");
      const brandLabel = document.getElementById("brand-label");
      const connection = document.getElementById("connection");
      const connectionLabel = document.getElementById("connection-label");
      const buttonA = document.getElementById("button-a");
      const buttonB = document.getElementById("button-b");
      const controls = document.querySelector(".controls");
      const buttonALabel = document.getElementById("button-a-label");
      const buttonBLabel = document.getElementById("button-b-label");
      const recordingOverlay = document.getElementById("recording");
      const toast = document.getElementById("toast");
      const MESSAGE_CHARACTERS_PER_LINE = measureMessageCharactersPerLine();
      let toastTimer = 0;
      let socket;
      let mediaStream;
      let audioContext;
      let audioSource;
      let audioProcessor;
      let playbackContext;
      let playbackCursor = 0;

      function connect() {
        if (state.switchingAgent) return;
        if (!token) {
          showToast("Missing simulator token. Open this page from the Electron app.");
          return;
        }
        socket = new WebSocket(socketUrl);
        socket.binaryType = "arraybuffer";
        socket.addEventListener("open", () => {
          state.connected = true;
          connection.classList.add("online");
          connectionLabel.textContent = "Online";
          send({ type: "hello", device: "html-simulator" });
          render();
        });
        socket.addEventListener("close", () => {
          state.connected = false;
          connection.classList.remove("online");
          connectionLabel.textContent = state.switchingAgent ? "Choose agent" : "Retrying";
          render();
          if (!state.switchingAgent) window.setTimeout(connect, 1500);
        });
        socket.addEventListener("message", (event) => {
          if (typeof event.data !== "string") {
            void playOutputPcm(event.data);
            return;
          }
          const message = JSON.parse(event.data);
          if (message.type === "hello") {
            state.transcription = message.transcription;
            state.agentName = message.agentName || "";
          } else if (message.type === "threads") {
            state.threads = message.threads;
            state.threadPage = Math.min(state.threadPage, lastThreadPage());
          } else if (message.type === "thread") {
            const changedThread = state.thread?.id !== message.thread.id;
            state.thread = message.thread;
            state.view = "thread";
            if (changedThread) {
              state.readerMessageId = null;
              state.readerPage = 0;
              state.awaitingResponse = false;
            }
            selectReaderMessage(message.thread.messages || []);
          } else if (message.type === "status") {
            state.status = message.status;
          } else if (message.type === "transcript") {
            showToast(
              message.role === "user"
                ? `Heard: ${message.text}`
                : `Codex: ${message.text}`,
              4000,
            );
          } else if (message.type === "error") {
            showToast(message.message, 5000);
            state.status = "ready";
            state.awaitingResponse = false;
          }
          render();
        });
      }

      function send(message) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(message));
        }
      }

      function render() {
        brandLabel.textContent = state.view === "agents"
          ? "Codex Remote"
          : state.agentName || "Codex Remote";
        connection.classList.toggle("online", state.connected);
        if (state.view === "threads") {
          controls.classList.remove("single");
          buttonA.hidden = false;
          buttonB.hidden = false;
          renderThreads();
          buttonALabel.textContent = "Agents";
          buttonBLabel.textContent = "New thread";
        } else if (state.view === "thread") {
          controls.classList.remove("single");
          buttonA.hidden = false;
          buttonB.hidden = false;
          renderConversation();
          buttonALabel.textContent = state.recording ? "Cancel" : "Back";
          buttonBLabel.textContent = state.recording ? "Send" : "Talk";
        } else {
          controls.classList.remove("single");
          buttonA.hidden = false;
          buttonB.hidden = false;
          renderAgents();
          buttonALabel.textContent = "Back";
          buttonBLabel.textContent = "Refresh";
        }
        recordingOverlay.classList.toggle("visible", state.recording);
      }

      function renderThreads() {
        const start = state.threadPage * THREADS_PER_PAGE;
        const entries = state.threads.slice(start, start + THREADS_PER_PAGE);
        screen.innerHTML = `
          <p class="eyebrow">${threadPageLabel()}</p>
          <div class="thread-list">
            ${entries.map((thread, visibleIndex) => {
              const index = start + visibleIndex;
              return `
                <article class="thread-card" data-thread-index="${index}">
                  <span class="thread-icon">›</span>
                  <div class="thread-copy">
                    <div class="thread-title">${escapeHtml(thread.title || "Untitled")}</div>
                    <div class="thread-preview">${escapeHtml(thread.preview || "No messages yet")}</div>
                  </div>
                  <span class="thread-age">${relativeAge(thread.updatedAt)}</span>
                </article>
              `;
            }).join("")}
          </div>
        `;
        screen.querySelectorAll("[data-thread-index]").forEach((element) => {
          element.addEventListener("click", () => {
            openThread(Number(element.dataset.threadIndex));
          });
        });
      }

      function threadPageLabel() {
        if (state.threads.length === 0) return "No recent threads";
        const first = state.threadPage * THREADS_PER_PAGE + 1;
        const last = Math.min(state.threads.length, first + THREADS_PER_PAGE - 1);
        return `${first}–${last} of ${state.threads.length} threads`;
      }

      function renderAgents() {
        const start = state.agentPage * THREADS_PER_PAGE;
        const entries = state.agents.slice(start, start + THREADS_PER_PAGE);
        screen.innerHTML = `
          <p class="eyebrow">${agentPageLabel()}</p>
          <div class="thread-list">
            ${entries.map((agent, visibleIndex) => `
              <article class="thread-card agent-card" data-agent-index="${start + visibleIndex}">
                <span class="agent-icon" aria-hidden="true"></span>
                <div class="thread-copy">
                  <div class="thread-title agent-title">${escapeHtml(agent.name)}</div>
                </div>
                <span class="agent-chevron" aria-hidden="true">›</span>
              </article>
            `).join("")}
          </div>
        `;
        screen.querySelectorAll("[data-agent-index]").forEach((element) => {
          element.addEventListener("click", () => {
            selectSimulatorAgent(Number(element.dataset.agentIndex));
          });
        });
      }

      function agentPageLabel() {
        if (state.agents.length === 0) return "No agents found";
        const first = state.agentPage * THREADS_PER_PAGE + 1;
        const last = Math.min(state.agents.length, first + THREADS_PER_PAGE - 1);
        return `${first}–${last} of ${state.agents.length} agents`;
      }

      function renderConversation() {
        const thread = state.thread;
        if (!thread) {
          screen.innerHTML = '<div class="empty">Loading thread…</div>';
          return;
        }
        const messages = thread.messages || [];
        const selection = readerSelection(messages);
        screen.innerHTML = `
          <div class="conversation">
            <div class="conversation-title">
              <button class="back-button" type="button" aria-label="Back to threads">‹</button>
              <h1>${escapeHtml(thread.title)}</h1>
              <span class="activity ${thread.busy ? "busy" : ""}">${thread.busy ? "Working" : "Ready"}</span>
            </div>
            <div class="reader-status">${readerStatus(selection, messages.length)}</div>
            <div class="message-reader">
              ${renderReaderPage(selection)}
            </div>
          </div>
        `;
        screen.querySelector(".back-button")?.addEventListener("click", backToThreads);
        screen.querySelector(".message-page.assistant")?.addEventListener("click", () => {
          const current = readerSelection(messages);
          if (!current) return;
          send({
            type: "speak_message",
            threadId: thread.id,
            messageId: current.message.id,
          });
        });
      }

      function renderReaderPage(selection) {
        if (state.awaitingResponse) {
          return '<div class="reader-waiting">Waiting for Codex…</div>';
        }
        if (!selection) {
          return '<div class="empty">Press PWR, speak, then press PWR to send.</div>';
        }
        const role = selection.message.role === "user" ? "You" : "Codex";
        const continuation = selection.page > 0 ? " · continued" : "";
        return `
          <article class="message-page ${selection.message.role} ${selection.message.status === "streaming" ? "streaming" : ""}">
            <div class="message-role">${role}${continuation}</div>
            <pre class="message-copy">${escapeHtml(selection.lines.join("\n"))}</pre>
          </article>
        `;
      }

      function readerSelection(messages) {
        if (state.awaitingResponse || messages.length === 0) return null;
        let messageIndex = messages.findIndex((message) => message.id === state.readerMessageId);
        if (messageIndex < 0) messageIndex = messages.length - 1;
        const message = messages[messageIndex];
        const pages = paginateMessage(message.text);
        const page = Math.min(Math.max(0, state.readerPage), pages.length - 1);
        return {
          message,
          messageIndex,
          page,
          pageCount: pages.length,
          lines: pages[page],
        };
      }

      function readerStatus(selection, total) {
        if (state.awaitingResponse) return "New response · page 1 · waiting";
        if (!selection) return "No messages yet";
        const streaming = selection.message.status === "streaming" ? " · streaming" : "";
        return `Message ${selection.messageIndex + 1}/${total} · page ${selection.page + 1}/${selection.pageCount}${streaming}`;
      }

      function paginateMessage(text) {
        const lines = wrapText(String(text || ""), MESSAGE_CHARACTERS_PER_LINE);
        const pages = [];
        for (let index = 0; index < lines.length; index += MESSAGE_LINES_PER_PAGE) {
          pages.push(lines.slice(index, index + MESSAGE_LINES_PER_PAGE));
        }
        return pages.length ? pages : [[""]];
      }

      function wrapText(text, width) {
        const lines = [];
        for (const paragraph of text.replaceAll("\r", "").split("\n")) {
          if (!paragraph) {
            lines.push("");
            continue;
          }
          let remaining = paragraph;
          while (remaining.length > width) {
            let split = remaining.lastIndexOf(" ", width);
            if (split <= 0) split = width;
            lines.push(remaining.slice(0, split));
            remaining = remaining.slice(split).trimStart();
          }
          lines.push(remaining);
        }
        return lines.length ? lines : [""];
      }

      function measureMessageCharactersPerLine() {
        const page = document.createElement("article");
        page.className = "message-page";
        page.style.visibility = "hidden";
        const copy = document.createElement("pre");
        copy.className = "message-copy";
        const ruler = document.createElement("span");
        ruler.textContent = "M".repeat(100);
        copy.appendChild(ruler);
        page.appendChild(copy);
        screen.appendChild(page);
        const availableWidth = copy.clientWidth;
        const characterWidth = ruler.getBoundingClientRect().width / ruler.textContent.length;
        page.remove();
        if (availableWidth <= 0 || characterWidth <= 0) return 46;
        return Math.max(20, Math.floor((availableWidth - 1) / characterWidth));
      }

      function selectReaderMessage(messages) {
        if (state.awaitingResponse) {
          const assistant = [...messages].reverse().find((message) => (
            message.role === "assistant" && message.id !== state.responseBaselineId
          ));
          if (assistant) {
            state.readerMessageId = assistant.id;
            state.readerPage = 0;
            state.awaitingResponse = false;
          }
          return;
        }
        if (!state.readerMessageId && messages.length) {
          const latest = messages[messages.length - 1];
          state.readerMessageId = latest.id;
          state.readerPage = paginateMessage(latest.text).length - 1;
        }
      }

      function latestAssistantId(messages = state.thread?.messages || []) {
        return [...messages].reverse().find((message) => message.role === "assistant")?.id ?? null;
      }

      function lastThreadPage() {
        return Math.max(0, Math.ceil(state.threads.length / THREADS_PER_PAGE) - 1);
      }

      function pageForward() {
        if (state.view === "threads") {
          state.threadPage = Math.min(lastThreadPage(), state.threadPage + 1);
          render();
          return;
        }
        if (state.view === "agents") {
          const lastPage = Math.max(
            0,
            Math.ceil(state.agents.length / THREADS_PER_PAGE) - 1,
          );
          state.agentPage = Math.min(lastPage, state.agentPage + 1);
          render();
          return;
        }
        const messages = state.thread?.messages || [];
        const selection = readerSelection(messages);
        if (!selection) return;
        if (selection.page + 1 < selection.pageCount) {
          state.readerPage = selection.page + 1;
        } else if (selection.messageIndex + 1 < messages.length) {
          state.readerMessageId = messages[selection.messageIndex + 1].id;
          state.readerPage = 0;
        }
        render();
      }

      function pageBack() {
        if (state.view === "threads") {
          state.threadPage = Math.max(0, state.threadPage - 1);
          render();
          return;
        }
        if (state.view === "agents") {
          state.agentPage = Math.max(0, state.agentPage - 1);
          render();
          return;
        }
        const messages = state.thread?.messages || [];
        const selection = readerSelection(messages);
        if (!selection) return;
        if (selection.page > 0) {
          state.readerPage = selection.page - 1;
        } else if (selection.messageIndex > 0) {
          const previous = messages[selection.messageIndex - 1];
          state.readerMessageId = previous.id;
          state.readerPage = paginateMessage(previous.text).length - 1;
        }
        render();
      }

      function backToThreads() {
        state.view = "threads";
        state.awaitingResponse = false;
        send({ type: "list_threads" });
        render();
      }

      async function loadAgents() {
        try {
          const response = await fetch(`/api/v1/agents?token=${encodeURIComponent(token)}`, {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("Agent list unavailable");
          const result = await response.json();
          state.agents = result.agents || [];
        } catch (error) {
          showToast(error instanceof Error ? error.message : String(error));
        }
        render();
      }

      function showAgentSelector() {
        if (state.view !== "threads") return;
        state.switchingAgent = true;
        state.view = "agents";
        state.agentName = "";
        state.agentPage = 0;
        state.connected = false;
        connectionLabel.textContent = "Choose agent";
        socket?.close();
        void loadAgents();
        render();
      }

      function backFromAgentSelector() {
        if (state.view !== "agents") return;
        state.switchingAgent = false;
        state.view = "threads";
        state.agentPage = 0;
        connectionLabel.textContent = "Retrying";
        connect();
        render();
      }

      function selectSimulatorAgent(index) {
        const agent = state.agents[index];
        if (!agent) return;
        const target = new URL("/simulator", location.origin);
        target.searchParams.set("token", token);
        target.searchParams.set("agentId", agent.id);
        window.location.assign(target);
      }

      function createThread() {
        if (state.view !== "threads") return;
        state.thread = null;
        state.readerMessageId = null;
        state.readerPage = 0;
        state.view = "thread";
        send({ type: "create_thread" });
        render();
      }

      function openThread(index) {
        if (state.view !== "threads") return;
        const thread = state.threads[index];
        if (!thread) return;
        state.thread = null;
        state.readerMessageId = null;
        state.readerPage = 0;
        state.view = "thread";
        send({ type: "open_thread", threadId: thread.id });
        render();
      }

      async function startTalk() {
        if (state.view !== "thread" || state.recording || !state.thread) return;
        if (state.transcription !== "available") {
          showToast("Speech transcription is unavailable on this desktop.");
          return;
        }
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
          audioContext = new AudioContext();
          audioSource = audioContext.createMediaStreamSource(mediaStream);
          audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
          audioProcessor.onaudioprocess = (event) => {
            if (!state.recording || socket?.readyState !== WebSocket.OPEN) return;
            const pcm = downsampleToPcm16(
              event.inputBuffer.getChannelData(0),
              audioContext.sampleRate,
              24000,
            );
            socket.send(pcm.buffer);
          };
          audioSource.connect(audioProcessor);
          audioProcessor.connect(audioContext.destination);
          state.recording = true;
          send({
            type: "audio_start",
            threadId: state.thread.id,
            sampleRate: 24000,
          });
          render();
        } catch (error) {
          showToast(error instanceof Error ? error.message : String(error));
        }
      }

      function stopTalk() {
        if (!state.recording) return;
        stopLocalRecording();
        state.responseBaselineId = latestAssistantId();
        state.readerMessageId = null;
        state.readerPage = 0;
        state.awaitingResponse = true;
        send({ type: "audio_end" });
        render();
      }

      function cancelTalk() {
        if (!state.recording) return;
        stopLocalRecording();
        state.awaitingResponse = false;
        send({ type: "audio_cancel" });
        render();
      }

      function stopLocalRecording() {
        state.recording = false;
        audioProcessor?.disconnect();
        audioSource?.disconnect();
        mediaStream?.getTracks().forEach((track) => track.stop());
        void audioContext?.close();
        mediaStream = null;
        audioContext = null;
        audioSource = null;
        audioProcessor = null;
      }

      function downsampleToPcm16(input, inputRate, outputRate) {
        const ratio = inputRate / outputRate;
        const outputLength = Math.max(1, Math.floor(input.length / ratio));
        const output = new Int16Array(outputLength);
        for (let outputIndex = 0; outputIndex < outputLength; outputIndex += 1) {
          const start = Math.floor(outputIndex * ratio);
          const end = Math.min(input.length, Math.floor((outputIndex + 1) * ratio));
          let sum = 0;
          for (let inputIndex = start; inputIndex < end; inputIndex += 1) {
            sum += input[inputIndex];
          }
          const sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
          output[outputIndex] = sample < 0 ? sample * 32768 : sample * 32767;
        }
        return output;
      }

      async function playOutputPcm(data) {
        const bytes = data instanceof ArrayBuffer ? data : await data.arrayBuffer();
        if (bytes.byteLength < 2) return;
        playbackContext ||= new AudioContext();
        if (playbackContext.state === "suspended") await playbackContext.resume();
        const input = new DataView(bytes);
        const samples = Math.floor(bytes.byteLength / 2);
        const buffer = playbackContext.createBuffer(1, samples, 24000);
        const output = buffer.getChannelData(0);
        for (let index = 0; index < samples; index += 1) {
          output[index] = input.getInt16(index * 2, true) / 32768;
        }
        const source = playbackContext.createBufferSource();
        source.buffer = buffer;
        source.connect(playbackContext.destination);
        const startsAt = Math.max(playbackContext.currentTime + 0.02, playbackCursor);
        source.start(startsAt);
        playbackCursor = startsAt + buffer.duration;
      }

      function showToast(message, duration = 3000) {
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("visible"), duration);
      }

      function relativeAge(value) {
        if (!value) return "";
        const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
        if (seconds < 60) return "now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h`;
        return `${Math.floor(seconds / 86400)}d`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      buttonA.addEventListener("click", () => {
        if (state.view === "threads") showAgentSelector();
        else if (state.view === "agents") backFromAgentSelector();
        else if (state.recording) cancelTalk();
        else backToThreads();
      });
      buttonB.addEventListener("click", () => {
        if (state.view === "threads") createThread();
        else if (state.view === "agents") void loadAgents();
        else if (state.recording) stopTalk();
        else void startTalk();
      });

      let gestureStart = null;
      let suppressScreenTap = false;
      screen.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        gestureStart = { x: event.clientX, y: event.clientY };
      });
      screen.addEventListener("pointerup", (event) => {
        if (!gestureStart) return;
        const dx = event.clientX - gestureStart.x;
        const dy = event.clientY - gestureStart.y;
        gestureStart = null;
        if (Math.abs(dy) < 44 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
        suppressScreenTap = true;
        event.preventDefault();
        if (dy > 0) pageBack();
        else pageForward();
        window.setTimeout(() => {
          suppressScreenTap = false;
        }, 0);
      });
      screen.addEventListener("pointercancel", () => {
        gestureStart = null;
      });
      screen.addEventListener("click", (event) => {
        if (suppressScreenTap) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      document.addEventListener("keydown", (event) => {
        if (event.repeat) return;
        if (event.code === "ArrowDown" || event.code === "ArrowRight") {
          event.preventDefault();
          pageForward();
        } else if (event.code === "ArrowUp" || event.code === "ArrowLeft") {
          event.preventDefault();
          pageBack();
        } else if (event.code === "Escape") {
          if (state.view === "thread") {
            event.preventDefault();
            backToThreads();
          }
        } else if (event.code === "Space" && state.view === "thread") {
          event.preventDefault();
          void startTalk();
        }
      });
      document.addEventListener("keyup", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          stopTalk();
        }
      });

      render();
      void loadAgents();
      connect();
    </script>
  </body>
</html>
